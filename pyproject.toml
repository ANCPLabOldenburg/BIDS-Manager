[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bids-manager"
version = "1.4.1"
description = "Schema-driven BIDS converter, curator, and editor (re-imagination of BIDS-Manager v0.2.5)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Karel Lopez Vilaret", email = "karel.mauricio.lopez.vilaret@uni-oldenburg.de"},
    {name = "Karel Lopez Vilaret"},
    {name = "Jochem Rieger"},
]
maintainers = [
    {name = "ANCP Lab, University of Oldenburg", email = "karel.mauricio.lopez.vilaret@uni-oldenburg.de"},
]
keywords = ["BIDS", "DICOM", "EEG", "MEG", "GUI", "Neuroimaging"]
requires-python = ">=3.10,<3.15"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

# Core dependencies.
# Bounds strategy:
#   lower bound  = oldest version that works with any supported Python (3.10+).
#   upper bound  = latest version tested in the reference env (Python 3.10 venv
#                  with pandas-3 strict-string-dtype simulated via
#                  pd.options.future.infer_string; Python 3.14 venv tested
#                  separately by the user).
# On older Pythons pip picks the newest release that fits both the version
# range AND that Python's compatibility.
dependencies = [
    # Schema engine. The keystone of the architecture.
    "bidsschematools>=1.0,<=1.2.2",
    "ancpbids>=0.3,<=0.3.1",

    # bidsval, the BIDS validation engine and the interpreter of the schema,
    # is VENDORED at ``bidsmgr/vendor/bidsval`` rather than depended on. It is
    # the single implementation of every schema fact BIDS Manager acts on
    # (guard 8: which fields apply, at what level, of what type) as well as of
    # validation itself. Depending on it through PyPI meant a schema fix could
    # not be tested from here without publishing a release first. It pulls only
    # deps BIDS Manager already ships, so vendoring costs nothing new. See
    # ``bidsmgr/vendor/README.md``.

    # GUI.
    "pyqt6>=6.5,<=6.11.0",

    # Strongly-typed core abstractions.
    "pydantic>=2.6,<=2.13.4",

    # MRI conversion stack. dcm2niix invoked directly.
    # The FLOOR is EXACT, and it is not a guess. Measured 2026-09-25 by running
    # both ends of the old range over the same Siemens study:
    #
    #   v1.0.20260416  19 NIfTI, no spectroscopy at all, localisers labelled
    #                  `derived`, one series guessed `bold`
    #   v1.0.20260724  21 NIfTI, both `_svs` series converted with
    #                  BidsGuess ['mrs', '_svs'], localisers `discard`,
    #                  that series guessed `sbref`
    #
    # So the old floor allowed a build that CANNOT convert spectroscopy, and
    # pip's default upgrade strategy is `only-if-needed`: anybody who installed
    # while 20260416 satisfied the pin kept it through every later upgrade and
    # got a tool where MRS silently produced nothing. That is what "MRS does
    # not work on Windows and Linux" turned out to be, and it was never about
    # those platforms: all seven wheels exist for both versions.
    #
    # The ceiling stays pinned because the PET sidecar contract moved inside
    # this range (TimeZero and InjectionStart gave way to SeriesTime, and
    # `fixups/pet_sidecar` DERIVES TimeZero from SeriesTime), so a resolver
    # free to roam would silently change what a PET scan means.
    "dcm2niix>=1.0.20260724,<=1.0.20260724",
    "pydicom>=2.4,<=3.0.2",
    "nibabel>=5.0,<=5.4.2",

    # PET. pet2bids is the reference implementation from the OpenNeuroPET group,
    # and the work it does that we would otherwise duplicate is real: reading
    # PMOD blood curves, and parsing the ECAT7 headers our own reader skims.
    #
    # It does NOT bring its own dcm2niix. It looks for one on PATH and only
    # unzips its bundled copy when it finds none, so the binary pinned above is
    # the one both of us use. BIDS Manager sets DCM2NIIX_PATH explicitly so
    # there is never a question about which.
    "pypet2bids>=1.5.1,<2",

    # CITATION.cff. Reached through bidsval today, but BIDS Manager now reads
    # and writes the file itself (the Editor renders it as a form), so the
    # dependency is declared rather than inherited.
    "pyyaml>=5.4,<=6.0.3",

    # EEG / MEG / iEEG conversion stack.
    "mne>=1.6,<=1.12.1",
    "mne-bids>=0.15,<=0.17.0",
    "edfio>=0.3,<=0.4.13",

    # Physio (Siemens PhysioLog DICOM to BIDS): vendored at
    # ``bidsmgr.vendor.bidsphysio`` (MIT, see that subdir's LICENSE).
    # No transitive setuptools cap required as a result.

    # Data handling.
    "pandas>=2.0,<3.0",
    "numpy>=1.26,<3.0",
    "joblib>=1.3,<=1.5.3",

    # System info (CPU thread count, total RAM) shown in Settings and used
    # to cap the parallel-workers spinboxes. Already pulled in transitively
    # by joblib/loky; declared explicitly so the cap never silently breaks.
    "psutil>=5.9,<=7.0.0",

    # Editor viewer (NIfTI slices + MEG/EEG time-series + PSD, all
    # rendered in-app with pyqtgraph - no matplotlib dependency).
    "pyqtgraph>=0.13,<=0.14.0",
    "PyOpenGL>=3.1,<=3.1.10",

    # GUI icons. Ships its own MDI6 / Font Awesome / Phosphor TTFs so
    # toolbar / tab / chip glyphs render identically on macOS, Linux,
    # and Windows instead of falling back to per-OS emoji fonts.
    "qtawesome>=1.3,<=1.4.2",

    # Defacing and skull stripping. NOT optional: these are reached from the
    # GUI, and somebody who installed BIDS Manager by double-clicking an
    # installer has no terminal in which to add an extra, so an optional
    # extra is a feature they cannot switch on.
    #
    # Neither adds a system dependency. niimath ships its binary inside the
    # wheel the way dcm2niix does (no FSL, no FreeSurfer, no ANTs), and
    # brainchop runs the mindgrab network on tinygrad, which is pure Python
    # (no torch, no onnxruntime).
    #
    # The marker is load-bearing. niimath tags its wheels per Python version
    # rather than abi3, and there is no 3.14 wheel yet, so an unconditional
    # pin would make BIDS Manager itself UNINSTALLABLE on a Python we claim
    # to support. On 3.14 the app installs, the menu entry greys out, and the
    # tooltip says why. Drop the marker once the wheel exists.
    "niimath>=1.0.20250526; python_version < '3.14'",
    "brainchop>=0.2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "ruff>=0.4",
    "build>=1.0",
    "twine>=4.0",
]

[project.urls]
Homepage      = "https://github.com/ANCPLabOldenburg/BIDS-Manager"
Repository    = "https://github.com/ANCPLabOldenburg/BIDS-Manager"
Documentation = "https://ancplaboldenburg.github.io/bids_manager_documentation/"
Tracker       = "https://github.com/ANCPLabOldenburg/BIDS-Manager/issues"

# Console entry points. All routed through the ``bidsmgr`` package.
# The PyPI distribution is ``bids-manager`` but the import name is
# ``bidsmgr`` (same pattern as ``pip install scikit-learn`` then
# ``import sklearn``).
[project.scripts]
bidsmgr           = "bidsmgr.main:main"
bidsmgr-create    = "bidsmgr.cli.create:main"
bidsmgr-adopt     = "bidsmgr.cli.adopt:main"
bidsmgr-project   = "bidsmgr.cli.project:main"
bidsmgr-scan      = "bidsmgr.cli.scan:main"
bidsmgr-convert   = "bidsmgr.cli.convert:main"
bidsmgr-rebuild   = "bidsmgr.cli.rebuild:main"
bidsmgr-metadata  = "bidsmgr.cli.metadata:main"
bidsmgr-validate  = "bidsmgr.cli.validate:main"
bidsmgr-deface    = "bidsmgr.cli.deface:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["bidsmgr*"]

[tool.setuptools.package-data]
"bidsmgr.gui"               = [
    "*.qss",
    "assets/*.png",
    "assets/*.jpg",
    "assets/*.jpeg",
    "assets/macos/*.png",
    "assets/macos/*.icns",
    "assets/windows/*.ico",
]
# NOTE: no "bidsmgr.schema" entry. That package is a pure adapter over
# bidsval and ships no data; it used to carry a "bundled/**/*" glob pointing
# at a directory that does not exist, which quietly matched nothing.
# The defacing atlas: a matched template and mask that must travel together.
# See bidsmgr/deface/atlas/PROVENANCE.md.
"bidsmgr.deface"            = ["atlas/*.nii.gz", "atlas/PROVENANCE.md"]
"bidsmgr.vendor"            = ["README.md"]
# A Windows dcm2niix that can convert MR spectroscopy. The released one
# cannot: it is killed with 0xC00000FD before it writes anything. Used only
# as a fallback on that exit code, never in preference to the wheel's binary.
# See bidsmgr/vendor/dcm2niix_win/PROVENANCE.md.
"bidsmgr.vendor.dcm2niix_win" = ["dcm2niix.exe", "PROVENANCE.md", "LICENSE"]
"bidsmgr.vendor.bidsphysio" = ["LICENSE"]
"bidsmgr.vendor.bidsval"    = ["LICENSE"]
# The schema files bidsval resolves against. Vendoring the code without this
# ships a validator that cannot find a schema: it fell back to a separately
# installed bidsval on a developer machine and crashed on import everywhere
# else. 2.9 MB, six BIDS versions.
"bidsmgr.vendor.bidsval.schema" = ["bundled/*.json"]

[tool.ruff]
# Vendored code is a verbatim copy of somebody else's package and is not ours
# to restyle: see bidsmgr/vendor/README.md, where the refresh policy is
# "wholesale rather than patched". Linting it reports 21 findings we would
# have to re-introduce on every refresh, including the five that look like
# real defects (an undefined name, two `is` comparisons against literals, two
# `== True`). Those are worth reporting UPSTREAM, not silencing locally, and
# they are tracked there rather than here.
extend-exclude = ["bidsmgr/vendor"]

[tool.ruff.lint]
# Ruff's default set is E4, E7, E9, F. Kept, minus three rules this codebase
# deliberately works against. Three named rules rather than dropping whole
# families, so E711/E712 (comparing to None or True), E722 (bare except) and
# E741 keep working: those catch real mistakes, and the three below are
# formatting opinions.
ignore = [
    # One-line signal handlers. gui/widgets/nifti_gl_view.py has ~30 of the
    # form `def _on_gmix(self, v): self.gl.gradient_mix = v / 100; self.gl.update()`.
    # As a block they read as a table of slider-to-uniform bindings, and one
    # per three lines would be 90 lines of noise. A deliberate choice.
    "E702",   # multiple statements on one line (semicolon)
    # Deferred imports. The architecture keeps Qt out of the engine modules
    # (CLAUDE.md guard 2), which means importing inside a function on purpose,
    # and the worker threads import their heavy readers in run() so the GUI
    # starts fast. Both show up as "import not at top of file".
    "E402",   # module level import not at top of file
    # Assigning a lambda. Used for small local callbacks where a def would be
    # more ceremony than the callback.
    "E731",   # do not assign a lambda expression, use a def
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "real_data: requires real datasets under $BIDSMGR_TEST_DATA (see tests/fixtures/data_root.py), gated on env vars BIDS_MANAGER_REAL_{MRI,MEG,EEG,PET}_DATA",
    "gui: pytest-qt smoke tests, headless OK with QT_QPA_PLATFORM=offscreen",
    "integration: end-to-end CLI runs against the published sample datasets; fetches ~56 MB on first use and caches it outside the checkout",
]
